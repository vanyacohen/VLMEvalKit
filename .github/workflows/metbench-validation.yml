name: MET-Bench review validation
on:
  push:
    branches: [metbench-validation-20261123]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      HF_HUB_OFFLINE: '1'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install CPU PyTorch
        run: python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - name: Install framework and benchmark dependencies
        run: python -m pip install -e . pytest rouge-score -r vlmeval/dataset/metbench/requirements.txt
      - name: Run MET-Bench and framework regression tests
        run: python -m pytest tests/test_metbench.py tests/test_inference_api.py tests/test_text_dataset_display.py tests/test_dataset_alias.py -q
