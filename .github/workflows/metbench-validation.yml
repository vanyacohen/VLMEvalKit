name: MET-Bench review validation
on:
  push:
    branches: [metbench-validation-20261123]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      HF_HUB_OFFLINE: '1'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install CPU PyTorch
        run: python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - name: Install framework and benchmark dependencies
        run: python -m pip install -e . pytest rouge-score -r vlmeval/dataset/metbench/requirements.txt
      - name: Run MET-Bench and framework regression tests
        run: python -m pytest tests/test_metbench.py tests/test_inference_api.py tests/test_text_dataset_display.py -q
      - name: Confirm unrelated test failure on unmodified upstream
        run: |
          git worktree add --detach ../vlmeval-upstream 79140a6eaff749f6298cf27e6907f0e68b778819
          cd ../vlmeval-upstream
          set +e
          python -m pytest tests/test_dataset_alias.py::TestDatasetAlias::test_get_judge_kwargs_uses_dataset_default_model -q > baseline.log 2>&1
          result=$?
          set -e
          cat baseline.log
          test "$result" -eq 1
          grep -q "has no attribute 'judge_model_class'" baseline.log
